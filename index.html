<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tsukasa</title>

    <style>
        /* =====================================================
           EASY EDITING
           ===================================================== */

        :root {
            --text-color: #FCDCEC;
            --background-color: #000000;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background-color: var(--background-color);
            color: var(--text-color);

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .page {
            text-align: center;
            width: 90%;
            max-width: 800px;
        }

        /* KAngel image */
        .kangel {
            max-width: 100%;
            max-height: 70vh;

            object-fit: contain;
        }

        /* Message underneath the image */
        .message {
            margin-top: 20px;

            color: var(--text-color);

            font-size: 20px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="page">

        <!-- =================================================
             IMAGE
             Change "kangel.jpeg" if you want another image.
             ================================================= -->

        <img
            src="kangel.jpeg"
            alt="KAngel"
            class="kangel"
        >


        <!-- =================================================
             MESSAGE
             CHANGE THIS TEXT!!!
             ================================================= -->

        <div class="message">
           -.. --- / -.-- --- ..- / - .... .. -. -.- /
          - -.-. .... .- -. / .. ... / -.. . .- -.. ..--.. / .. / - .... .. -. -.- / - -.-. .... .- -. /
          .. ... / ... --- -- . .-- .... . .-. . .-.-.- / .. / -.-. .- -. - /
          ..-. .. -. -.. / .... . .-. .-.-.- / --- .....
        </div>

    </div>

</body>
</html>
